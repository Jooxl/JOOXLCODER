<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOOXL Coder - Cinematic Matrix Edition</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Cyber-Tech Grid Canvas -->
    <canvas id="nebula-canvas"></canvas>

    <!-- Circuit Energy Canvas -->
    <canvas id="circuit-canvas"></canvas>

    <!-- Sword Flash Overlay -->
    <div id="flash-overlay"></div>

    <!-- Cinematic Explosion Flash -->
    <div id="cinematic-flash"></div>

    <!-- Ambient Floating Shapes -->
    <div class="ambient-shapes">
        <div class="ambient-shape shape-1"></div>
        <div class="ambient-shape shape-2"></div>
        <div class="ambient-shape shape-3"></div>
    </div>

    <!-- JOOXL Branding -->
    <div id="jooxl-branding">
        <span class="brand-jooxl">JOOXL</span><span class="brand-coder">CODER</span>
    </div>

    <!-- UI Overlay Controls -->
    <div id="top-controls">
        <button id="menu-btn" title="Open History">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </button>
        <button id="notes-btn" title="Open Notes">
            <svg viewBox="0 0 24 24">
                <path
                    d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
            </svg>
        </button>
        <button id="settings-btn" title="Settings">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.04.3-.06.61-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
            </svg>
        </button>
        <div class="volume-control">
            <button id="volume-btn" title="Toggle Audio">
                <svg viewBox="0 0 24 24">
                    <path fill="#fff"
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Notes HUD Visor -->
    <div id="notes-hud" class="glass-hud spotlight-light-only">
        <textarea id="hud-textarea" spellcheck="false"
            placeholder="Enter logic notes or debug ideas here..."></textarea>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="glass-modal spotlight-light-only">
        <div class="modal-header">
            <h2>SYSTEM SETTINGS</h2>
            <button id="close-settings-btn">&times;</button>
        </div>
        <div class="modal-content settings-grid">
            <!-- Appearance Group -->
            <div class="settings-card">
                <h3><svg viewBox="0 0 24 24" width="18" height="18" fill="var(--primary-hex)"
                        style="margin-right: 8px;">
                        <path
                            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.41 2.26-4.39C12.92 3.04 12.46 3 12 3zm0 14c-2.76 0-5-2.24-5-5s2.24-5 5-5c1.61 0 3.06.77 3.96 1.95-1.04.59-1.76 1.66-1.76 2.9 0 1.25.72 2.32 1.76 2.91C15.06 16.23 13.61 17 12 17z" />
                    </svg> APPEARANCE</h3>
                <div class="setting-item">
                    <label>Syntax Theme</label>
                    <div class="theme-selector">
                        <button class="theme-btn active" data-theme="cyber-tech">Cyber Tech</button>
                        <button class="theme-btn" data-theme="ocean-neon">Ocean Neon</button>
                        <button class="theme-btn" data-theme="matrix-green">Matrix Green</button>
                        <button class="theme-btn" data-theme="dark-plasma">Dark Plasma</button>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Font Size</label>
                    <div class="slider-container">
                        <input type="range" id="font-size-slider" min="12" max="28" value="18">
                        <span id="font-size-display">18px</span>
                    </div>
                </div>
            </div>

            <!-- Editor Group -->
            <div class="settings-card">
                <h3><svg viewBox="0 0 24 24" width="18" height="18" fill="var(--primary-hex)"
                        style="margin-right: 8px;">
                        <path
                            d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" />
                    </svg> EDITOR CORE</h3>
                <div class="setting-item flex-between">
                    <label>Word Wrap</label>
                    <label class="switch">
                        <input type="checkbox" id="word-wrap-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item flex-between">
                    <label>Code Minimap</label>
                    <label class="switch">
                        <input type="checkbox" id="minimap-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item flex-between">
                    <label>Font Ligatures</label>
                    <label class="switch">
                        <input type="checkbox" id="ligatures-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <!-- System Group -->
            <div class="settings-card">
                <h3><svg viewBox="0 0 24 24" width="18" height="18" fill="var(--primary-hex)"
                        style="margin-right: 8px;">
                        <path
                            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.04.3-.06.61-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg> SYSTEM / UI CONTROL</h3>
                <div class="setting-item">
                    <label>Theme & Background</label>
                    <div class="theme-split-container" style="display: grid; grid-template-columns: 1.2fr 1fr 1fr; grid-auto-rows: 32px; gap: 8px; margin-top: 10px;">
                        <!-- Shapes (Left Column, 6 rows) -->
                        <button class="shape-btn active" data-shape="orange" style="grid-column: 1; grid-row: 1;">Constellation</button>
                        <button class="shape-btn" data-shape="purple" style="grid-column: 1; grid-row: 2;">Fractal Web</button>
                        <button class="shape-btn" data-shape="cyan" style="grid-column: 1; grid-row: 3;">Circuit Board</button>
                        <button class="shape-btn" data-shape="green" style="grid-column: 1; grid-row: 4;">Matrix Stream</button>
                        <button class="shape-btn" data-shape="pink" style="grid-column: 1; grid-row: 5;">Fluid Waves</button>
                        <button class="shape-btn" data-shape="yellow" style="grid-column: 1; grid-row: 6;">Lightning</button>
                        
                        <!-- Colors (Right Columns, 3 rows spanning 2 rows each) -->
                        <button class="site-btn color-btn active" data-site="orange" style="--site-color: #ff5500; grid-column: 2; grid-row: 1 / span 2; height: 100%;"></button>
                        <button class="site-btn color-btn" data-site="purple" style="--site-color: #aa00ff; grid-column: 3; grid-row: 1 / span 2; height: 100%;"></button>
                        
                        <button class="site-btn color-btn" data-site="cyan" style="--site-color: #00ffff; grid-column: 2; grid-row: 3 / span 2; height: 100%;"></button>
                        <button class="site-btn color-btn" data-site="green" style="--site-color: #00ff80; grid-column: 3; grid-row: 3 / span 2; height: 100%;"></button>
                        
                        <button class="site-btn color-btn" data-site="pink" style="--site-color: #ff0080; grid-column: 2; grid-row: 5 / span 2; height: 100%;"></button>
                        <button class="site-btn color-btn" data-site="yellow" style="--site-color: #ffd700; grid-column: 3; grid-row: 5 / span 2; height: 100%;"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar (History/Snippets) -->
    <div id="sidebar" class="glass-sidebar spotlight-light-only">
        <div class="sidebar-header">
            <h2>SAVED CODES</h2>
            <button id="save-current-btn">+ SAVE NEW</button>
        </div>
        <div id="history-list">
            <!-- Cards will be injected here dynamically -->
        </div>
    </div>

    <!-- Cinematic Scene Container -->
    <div id="scene-container">

        <!-- View 1: Glassmorphism Editor -->
        <div id="editor-view" class="scene-layer">
            <div class="glass-card spotlight-card" id="editor-card">
                <div class="refraction-layer"></div>
                <div class="glass-header">
                    <div class="editor-tabs" id="editor-tabs">
                        <!-- Tabs will be injected here via JS -->
                    </div>
                    <div class="header-controls">
                        <span class="status-indicator"></span>
                        <button id="start-btn">START / RUN <span class="arrow">➤</span></button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="editor-container"></div>
                    <!-- Effects Canvas Overlay for Keyboard combat -->
                    <canvas id="effects-canvas"></canvas>
                </div>
            </div>
        </div>

        <!-- View 2: Matte Black Terminal Execution Screen -->
        <div id="terminal-view" class="scene-layer">
            <div class="terminal-card spotlight-card" id="terminal-card">
                <div class="refraction-layer"></div>
                <div class="terminal-header">
                    <button id="back-btn"><span class="arrow">◄</span> REVERSE</button>
                    <span class="terminal-title">EXECUTION MATRIX</span>
                </div>
                <div class="terminal-layout">
                    <div class="terminal-left">
                        <div class="input-header">STDIN INPUT (اختياري)</div>
                        <textarea id="terminal-input"
                            placeholder="Enter standard input (e.g., numbers, text for std::cin)..."></textarea>
                    </div>
                    <div class="terminal-right">
                        <div id="terminal-output"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- AI Assistant Orb (Fixed) -->
    <div id="cyber-orb" class="cyber-orb">
        <div class="orb-core"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring-2"></div>

        <!-- Orb Pop-out Menu -->
        <div id="orb-menu" class="orb-menu">
            <button id="orb-analyze-btn" class="orb-btn" title="أين خطأي؟">
                <svg viewBox="0 0 24 24">
                    <path fill="#fff"
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z" />
                </svg>
            </button>
            <button id="orb-autofix-btn" class="orb-btn" title="إصلاح تلقائي">
                <svg viewBox="0 0 24 24">
                    <path fill="#fff"
                        d="M7.5 5.6L10 7 8.6 4.5 10 2 7.5 3.4 5 2l1.4 2.5L5 7zm12 9.8L17 14l1.4 2.5L17 19l2.5-1.4L22 19l-1.4-2.5L22 14zM22 2l-2.5 1.4L17 2l1.4 2.5L17 7l2.5-1.4L22 7l-1.4-2.5zm-7.63 5.29c-.39-.39-1.02-.39-1.41 0L1.29 18.96c-.39.39-.39 1.02 0 1.41l2.34 2.34c.39.39 1.02.39 1.41 0L16.7 11.05c.39-.39.39-1.02 0-1.41l-2.33-2.35zm-1.03 5.49l-2.12-2.12 2.44-2.44 2.12 2.12-2.44 2.44z" />
                </svg>
            </button>
            <div id="orb-text" class="orb-text spotlight-card">
                <div class="refraction-layer"></div>
                <div id="orb-text-content"></div>
            </div>
        </div>
    </div>

    <!-- Developer Credits & Socials -->
    <div id="jooxl-credits-container">
        <a id="jooxl-credits" href="https://t.me/j0oxl" target="_blank">Developed by JOOXL</a>
        <div class="social-icons">
            <a href="https://t.me/j0oxl" target="_blank" class="social-icon telegram" title="Telegram">
                <svg viewBox="0 0 24 24">
                    <path fill="#fff"
                        d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.223-.548.223l.188-2.85 5.18-4.686c.223-.204-.054-.31-.346-.116l-6.405 4.038-2.75-.86c-.598-.18-.61-.592.126-.884l10.748-4.14c.498-.198.938.116.78.93v.001z" />
                </svg>
            </a>
            <a href="https://www.instagram.com/_j00xl?igsh=MXp5bmdpZHMweGVn&utm_source=qr" target="_blank"
                class="social-icon instagram" title="Instagram">
                <svg viewBox="0 0 24 24">
                    <path fill="#fff"
                        d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />
                </svg>
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="audio.js"></script>
    <script src="nebula.js"></script>
    <script src="effects.js"></script>

    <!-- Load Monaco Editor via RequireJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
